[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "infa-sled"
version = "0.1.0"
description = "Lokalna, pasywna analiza potencjalnie szkodliwych skryptow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Gabriel Lakowski" },
  { name = "Piotr Kupczyk" },
]
dependencies = [
  "psutil>=5.9,<8",
]

[project.scripts]
infa-sled = "main:main"
infa-sled-monitor = "system_monitor:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "version",
  "main",
  "config",
  "connections",
  "errors",
  "fileio",
  "ioc",
  "models",
  "obfuscation",
  "pipeline",
  "reporting",
  "reputation",
  "rules",
  "sanitization",
  "system_monitor",
  "timing",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S324"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true

